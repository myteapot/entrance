[core]
log_level = "info"

[paths]
runtime_db = "data/entrance.db"
logs = "logs"
cache = "cache"
exports = "exports"
snapshots = "snapshots"
worktrees = "worktrees"

[plugins.launcher]
enabled = true
scan_paths = []

[plugins.forge]
enabled = true
http_port = 9315
project_dir = ""
agent_command = ""

[plugins.vault]
enabled = true

[shell.cli]
default_output = "json"

[shell.gui]
theme = "dark"
global_hotkey = "Alt+Space"

[shell.mcp]
enabled = true
mode = "stdio"
default_actor_role = "nota"
