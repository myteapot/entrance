[core]
theme = "dark"
log_level = "info"
mcp_enabled = true

[paths]
runtime_db = "data/entrance.db"
logs = "logs"
cache = "cache"
exports = "exports"
snapshots = "snapshots"
worktrees = "worktrees"

[plugins.launcher]
enabled = true
hotkey = "Alt+Space"
scan_paths = []

[plugins.forge]
enabled = false
http_port = 9721

[plugins.vault]
enabled = false
