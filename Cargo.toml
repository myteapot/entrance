[workspace]
members = [
    "core",
    "harness",
    "shell/cli",
    "shell/gui",
    "shell/mcp",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license-file = "LICENSE"
authors = ["Entrance Contributors"]

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "5"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tokio = { version = "1.50.0", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
ureq = { version = "2.10", features = ["json"] }
entrance-core = { path = "core" }
entrance-gui = { path = "shell/gui" }
entrance-harness = { path = "harness" }
entrance-mcp = { path = "shell/mcp" }

[workspace.dependencies.tauri-plugin-updater]
version = "2"

[workspace.dependencies.lnk]
version = "0.6"

[workspace.dependencies.winreg]
version = "0.56"

[profile.dev]
debug = 1
codegen-units = 512
incremental = true

[profile.test]
debug = 1
codegen-units = 512
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.test.package."*"]
opt-level = 1
